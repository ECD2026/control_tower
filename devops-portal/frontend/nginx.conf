# Public entry point of the portal (port 80 on the EC2 host).
#
#   /             React single-page app
#   /api/         FastAPI backend (handles its own auth)
#   /grafana/     Grafana  - only for logged-in portal users (auth_request)
#   /prometheus/  Prometheus UI/API - same protection

# Resolve container names at request time so nginx starts even if a
# monitoring container is still booting.
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects, so they keep whatever host:port the browser used.
    absolute_redirect off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    set $backend    http://backend:8000;
    set $grafana    http://grafana:3000;
    set $prometheus http://prometheus:9090;

    # Proxy API calls to backend
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Needed for SSE streaming
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Subrequest used by auth_request: 2xx lets the request through,
    # 401 sends the browser back to the portal login.
    location = /_portal_auth {
        internal;
        proxy_pass $backend/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location @portal_login {
        return 302 /#/login;
    }

    location /grafana/ {
        auth_request /_portal_auth;
        error_page 401 = @portal_login;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live (websocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /prometheus/ {
        auth_request /_portal_auth;
        error_page 401 = @portal_login;
        proxy_pass $prometheus;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
