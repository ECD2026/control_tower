# DevOps Automation Portal - full stack.
#
#   frontend (nginx)      :80   public entry point; serves the React app and
#                               reverse-proxies /api, /grafana, /prometheus
#   backend (FastAPI)     :8000 API, deployments, EC2 actions
#   cloudwatch-exporter   :9106 multi-account CloudWatch -> Prometheus metrics
#   prometheus            :9090 scrapes the exporter + node_exporter targets
#   grafana               :3000 dashboards, embedded in the portal UI
#
# Only the frontend is published on all interfaces. The other ports are
# bound to 127.0.0.1 for local debugging (and for `npm run dev`), so on the
# EC2 host they are reachable only through nginx, behind the portal login.
#
# Configuration comes from devops-portal/.env (see backend/.env.example).

x-backend-env: &backend-env
  DB_PATH: /data/deployments.db
  # Secrets - generated by infra/scripts/bootstrap-secrets.sh on AWS.
  PORTAL_ENCRYPTION_KEY: ${PORTAL_ENCRYPTION_KEY:-}
  PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-}
  PORTAL_WORKFLOW_KEY: ${PORTAL_WORKFLOW_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devops-portal-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PORTAL_ALLOW_SIGNUP: ${PORTAL_ALLOW_SIGNUP:-true}
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-false}
      DEPLOYMENT_RUNNER_MODE: ${DEPLOYMENT_RUNNER_MODE:-github_actions}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WORKFLOW: ${GITHUB_WORKFLOW:-portal-deploy.yml}
      GITHUB_REF_NAME: ${GITHUB_REF_NAME:-main}
      GITHUB_POLL_INTERVAL_SECONDS: ${GITHUB_POLL_INTERVAL_SECONDS:-5}
      GITHUB_REQUEST_TIMEOUT_SECONDS: ${GITHUB_REQUEST_TIMEOUT_SECONDS:-30}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-120}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-/grafana}
      GRAFANA_DASHBOARD_UID: ${GRAFANA_DASHBOARD_UID:-instance-overview}
      PROMETHEUS_URL: http://prometheus:9090/prometheus
      PROMETHEUS_TARGETS_PATH: /app/monitoring/prometheus/targets/instances.json
      PROMETHEUS_SCRAPE_ADDRESS: ${PROMETHEUS_SCRAPE_ADDRESS:-public}
      PORTAL_MONITORING_SG_ID: ${PORTAL_MONITORING_SG_ID:-}
      PORTAL_MONITORING_SG_REGION: ${PORTAL_MONITORING_SG_REGION:-}
    volumes:
      - backend_data:/data
      # The backend writes node_exporter targets here; Prometheus reads them.
      - ./monitoring:/app/monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cloudwatch-exporter:
    # Same image as the backend (shared build cache), different entry point.
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devops-portal-backend:latest
    command: ["python", "-m", "exporters.cloudwatch_exporter"]
    depends_on:
      - backend
    environment:
      <<: *backend-env
      CLOUDWATCH_EXPORTER_PORT: "9106"
      CLOUDWATCH_REFRESH_SECONDS: ${CLOUDWATCH_REFRESH_SECONDS:-60}
    volumes:
      - backend_data:/data   # reads instances + encrypted credentials
    ports:
      - "127.0.0.1:9106:9106"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORTAL_HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - grafana
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Served under /prometheus so nginx can proxy it without rewriting.
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Served at <portal>/grafana; nginx only forwards requests from
      # logged-in portal users, who get read-only (Viewer) access.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_DOMAIN: ${PORTAL_PUBLIC_HOST:-localhost}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - graf_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backend_data:
  prom_data:
  graf_data:
