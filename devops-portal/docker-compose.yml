version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DB_PATH=/data/deployments.db
      - DEPLOYMENT_RUNNER_MODE=${DEPLOYMENT_RUNNER_MODE:-local}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_WORKFLOW=${GITHUB_WORKFLOW:-portal-deploy.yml}
      - GITHUB_REF_NAME=${GITHUB_REF_NAME:-main}
      - GITHUB_POLL_INTERVAL_SECONDS=${GITHUB_POLL_INTERVAL_SECONDS:-5}
      - GITHUB_REQUEST_TIMEOUT_SECONDS=${GITHUB_REQUEST_TIMEOUT_SECONDS:-30}
      - SSH_KEY_DIR=${SSH_KEY_DIR:-/root/.ssh}
      - GRAFANA_PUBLIC_URL=${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      - GRAFANA_DASHBOARD_UID=${GRAFANA_DASHBOARD_UID:-instance-overview}
      - PROMETHEUS_TARGETS_PATH=${PROMETHEUS_TARGETS_PATH:-/app/monitoring/prometheus/targets/instances.json}
      - PORTAL_MONITORING_SG_ID=${PORTAL_MONITORING_SG_ID:-}
    volumes:
      - backend_data:/data
      - ~/.ssh:/root/.ssh:ro   # for Ansible SSH key access (read-only)
      - ./monitoring:/app/monitoring
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - graf_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backend_data:
  prom_data:
  graf_data:
