version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DB_PATH=/data/deployments.db
      - DEPLOYMENT_RUNNER_MODE=${DEPLOYMENT_RUNNER_MODE:-local}
      - JENKINS_BASE_URL=${JENKINS_BASE_URL:-}
      - JENKINS_JOB_NAME=${JENKINS_JOB_NAME:-}
      - JENKINS_USER=${JENKINS_USER:-}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN:-}
      - JENKINS_VERIFY_TLS=${JENKINS_VERIFY_TLS:-true}
      - JENKINS_POLL_INTERVAL_SECONDS=${JENKINS_POLL_INTERVAL_SECONDS:-3}
      - JENKINS_REQUEST_TIMEOUT_SECONDS=${JENKINS_REQUEST_TIMEOUT_SECONDS:-15}
      - SSH_KEY_DIR=${SSH_KEY_DIR:-/root/.ssh}
    volumes:
      - backend_data:/data
      - ~/.ssh:/root/.ssh:ro   # for Ansible SSH key access (read-only)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
