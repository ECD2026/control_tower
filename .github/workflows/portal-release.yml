name: Portal Release

# Tests the DevOps portal and redeploys it to the portal host on AWS.
#
#   push to main (devops-portal/**)  -> test -> deploy main
#   workflow_dispatch                -> test -> deploy the chosen ref
#
# Deploy = `aws ssm send-command` running /opt/devops-portal/bin/host-deploy.sh
# on the host (git checkout + .env from SSM + docker compose up --build).
# AWS access is keyless via OIDC; the role (devops-portal-host-github-release)
# can only run commands on the portal host.
#
# Repository variables (set once, see docs/demo-runbook.md):
#   PORTAL_RELEASE_ROLE_ARN  - terraform output github_release_role_arn
#   PORTAL_AWS_REGION        - e.g. ap-south-1
#   PORTAL_HOST_INSTANCE_ID  - terraform output instance_id

on:
  push:
    branches: [main]
    paths:
      - "devops-portal/**"
      - ".github/workflows/portal-release.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "devops-portal/**"
      - ".github/workflows/portal-release.yml"
      - ".github/workflows/portal-deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to deploy
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: portal-release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devops-portal/backend/requirements.txt

      - name: Backend tests
        working-directory: devops-portal/backend
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: devops-portal/frontend/package-lock.json

      - name: Frontend build
        working-directory: devops-portal/frontend
        run: |
          npm ci
          npm run build

      - name: Terraform validate (portal host)
        working-directory: devops-portal/infra/terraform
        run: |
          terraform init -backend=false -input=false >/dev/null
          terraform fmt -check
          terraform validate

  deploy:
    name: Deploy to portal host
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: portal-production
    env:
      AWS_REGION: ${{ vars.PORTAL_AWS_REGION }}
      INSTANCE_ID: ${{ vars.PORTAL_HOST_INSTANCE_ID }}
      DEPLOY_REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PORTAL_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.PORTAL_AWS_REGION }}

      - name: Run host-deploy.sh over SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "portal-release ${GITHUB_RUN_ID} ${DEPLOY_REF}" \
            --timeout-seconds 1800 \
            --parameters "commands=[\"/opt/devops-portal/bin/host-deploy.sh ${DEPLOY_REF}\"],executionTimeout=[\"1800\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes, then print its output.
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "Final status: $STATUS"
          test "$STATUS" = "Success"
